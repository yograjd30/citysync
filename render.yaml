services:
  # 1. Express API Gateway & Deterministic Simulation Engine
  - type: web
    name: citysync-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://citysync.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: citysync-ml
          property: host

  # 2. Python 3.11 FastAPI Machine Learning Inference Service
  - type: web
    name: citysync-ml
    runtime: python
    plan: free
    rootDir: backend/ml
    buildCommand: pip install -r requirements-serve.txt && python train.py
    startCommand: uvicorn serve:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ML_INTERNAL_API_KEY
        generateValue: true
